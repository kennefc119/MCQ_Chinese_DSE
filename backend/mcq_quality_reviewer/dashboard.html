<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCQ 題庫品質審核</title>
  <style>
    :root {
      --ink: #18241f;
      --muted: #64716b;
      --paper: #f4f6f1;
      --surface: #ffffff;
      --line: #d9dfd8;
      --green: #176b4a;
      --green-soft: #e5f3ec;
      --amber: #8b5b05;
      --amber-soft: #fff4d8;
      --red: #a63f37;
      --red-soft: #fbe9e6;
      --blue: #245c85;
      --shadow: 0 10px 30px rgba(31, 49, 40, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(23, 107, 74, 0.035) 1px, transparent 1px),
        linear-gradient(rgba(23, 107, 74, 0.035) 1px, transparent 1px),
        var(--paper);
      background-size: 24px 24px;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      letter-spacing: 0;
    }

    button, select { font: inherit; }
    button:focus-visible, select:focus-visible { outline: 3px solid rgba(36, 92, 133, 0.22); outline-offset: 2px; }

    .shell { min-height: 100vh; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 22px clamp(18px, 4vw, 54px);
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }

    h1 { margin: 0; font-family: "Noto Serif TC", "PMingLiU", serif; font-size: 24px; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .connection { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); }
    .dot.ok { background: var(--green); }

    main { width: min(1500px, calc(100% - 36px)); margin: 28px auto 60px; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }
    .actions, .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .batch-controls { display: flex; align-items: end; gap: 8px; flex-wrap: wrap; }
    .batch-field label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 10px; font-weight: 700; }
    .batch-field input { width: 68px; height: 34px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: var(--surface); font: inherit; font-size: 12px; }
    .batch-field input:focus { border-color: var(--blue); outline: 3px solid rgba(36, 92, 133, 0.12); }
    .batch-progress { min-width: 150px; color: var(--muted); font-size: 11px; line-height: 1.4; }

    .settings-band {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(220px, 1fr) 150px auto;
      align-items: end;
      gap: 12px;
      margin-bottom: 18px;
      padding: 15px 16px;
      background: rgba(255, 255, 255, 0.9);
      border-top: 3px solid var(--green);
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .setting-field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .setting-field input {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 7px 9px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
    }
    .setting-field input:focus { border-color: var(--blue); outline: 3px solid rgba(36, 92, 133, 0.12); }
    .settings-actions { display: flex; align-items: center; gap: 8px; min-height: 36px; }
    .settings-status { color: var(--muted); font-size: 11px; white-space: nowrap; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(24, 36, 31, 0.42);
    }
    .modal.open { display: flex; }
    .modal-panel {
      width: min(760px, 100%);
      max-height: min(760px, calc(100vh - 36px));
      overflow-y: auto;
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(24, 36, 31, 0.24);
    }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .modal-title { margin: 0; font-family: "Noto Serif TC", "PMingLiU", serif; font-size: 20px; }
    .modal-close { padding: 5px 9px; font-size: 18px; line-height: 1; }
    .edit-label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .edit-textarea {
      width: 100%;
      min-height: 76px;
      resize: vertical;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--ink);
      background: #fbfcfa;
      font: inherit;
      font-size: 13px;
      line-height: 1.6;
    }
    .edit-textarea:focus { border-color: var(--blue); outline: 3px solid rgba(36, 92, 133, 0.12); }
    .edit-option-row { display: grid; grid-template-columns: 32px 1fr; gap: 8px; align-items: start; margin-top: 9px; }
    .edit-option-label { padding-top: 10px; color: var(--muted); font-weight: 750; }
    .edit-correct { margin-top: 5px; color: var(--green); font-size: 11px; font-weight: 700; }
    .edit-original { margin-top: 5px; padding: 7px 8px; border-left: 3px solid var(--line); color: var(--muted); background: #f5f7f4; font-size: 11px; line-height: 1.5; }
    .modal-note { margin-top: 12px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    button, .download {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 13px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      font-weight: 650;
    }
    button:hover, .download:hover { border-color: #aeb9b0; background: #fafcf9; }
    button:disabled { opacity: 0.48; cursor: not-allowed; }
    .primary { background: var(--green); color: white; border-color: var(--green); }
    .primary:hover { background: #10583c; border-color: #10583c; }
    .danger { color: var(--red); }
    .filter.active { color: white; background: var(--ink); border-color: var(--ink); }

    .stats {
      display: grid;
      grid-template-columns: repeat(6, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 13px 15px;
      box-shadow: var(--shadow);
    }
    .stat-label { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
    .stat-value { font-family: "Noto Serif TC", "PMingLiU", serif; font-size: 25px; font-weight: 700; }

    .progress-shell { height: 5px; background: #dfe5df; border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
    .progress { width: 0; height: 100%; background: var(--green); transition: width 300ms ease; }

    .notice {
      display: none;
      margin-bottom: 14px;
      border: 1px solid #e2c16f;
      background: var(--amber-soft);
      color: var(--amber);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
    }
    .notice.error { border-color: #e3a19b; background: var(--red-soft); color: var(--red); }

    .table-wrap { height: min(68vh, 760px); min-height: 360px; overflow: auto; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
    table { width: 100%; min-width: 980px; border-collapse: collapse; font-size: 12px; }
    th { position: sticky; top: 0; z-index: 2; text-align: left; color: var(--muted); background: #f8faf7; padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td { padding: 11px 12px; border-bottom: 1px solid #e8ece7; vertical-align: top; }
    tbody tr:hover { background: #fbfcfa; }
    .stem { min-width: 210px; max-width: 340px; line-height: 1.65; }
    .meta { color: var(--muted); margin-top: 5px; font-size: 11px; }
    .badge { display: inline-block; border-radius: 4px; padding: 3px 7px; font-weight: 700; white-space: nowrap; }
    .passed { color: var(--green); background: var(--green-soft); }
    .pending, .correction_proposed { color: var(--amber); background: var(--amber-soft); }
    .failed, .rejected { color: var(--red); background: var(--red-soft); }
    .approved, .pushed { color: var(--blue); background: #e6f0f7; }
    .scanning, .not_required { color: var(--muted); background: #eef1ed; }
    .score { font-size: 17px; font-weight: 750; }
    .score.good { color: var(--green); }
    .score.low { color: var(--red); }
    .row-actions { display: flex; gap: 6px; min-width: 200px; flex-wrap: wrap; }
    .row-actions button { padding: 6px 9px; font-size: 11px; }
    .selection-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: #f8faf7; }
    .selection-count { min-width: 150px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .selection-bar button { padding: 6px 9px; font-size: 11px; }
    .score-quick-select { display: none; align-items: center; gap: 6px; flex-wrap: wrap; width: 100%; padding-top: 7px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .score-quick-select.visible { display: flex; }
    .score-quick-select select { height: 30px; padding: 4px 7px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: white; font: inherit; }
    .row-select, .select-page { width: 15px; height: 15px; accent-color: var(--green); vertical-align: middle; }
    .row-select:disabled { opacity: 0.35; }
    .empty { padding: 48px; text-align: center; color: var(--muted); }

    details { margin-top: 8px; }
    summary { cursor: pointer; color: var(--blue); font-weight: 650; }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 9px; min-width: 520px; }
    .option-list { padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: #fafbf9; }
    .option-list strong { display: block; margin-bottom: 7px; }
    .option { padding: 6px 0; border-top: 1px solid #e7ebe6; line-height: 1.5; }
    .option.correct { color: var(--green); font-weight: 650; }
    .option-explanation { margin-top: 4px; color: var(--muted); font-size: 11px; font-weight: 400; line-height: 1.5; }
    .comment { max-width: 320px; line-height: 1.6; color: #3e4c45; }
    .trace-details { margin-top: 9px; }
    .trace-details summary { font-size: 11px; }
    .trace-list { display: grid; gap: 7px; margin-top: 7px; min-width: 360px; }
    .trace-card { padding: 8px; border: 1px solid var(--line); border-radius: 5px; background: #fafbf9; }
    .trace-head { color: var(--blue); font-size: 11px; font-weight: 750; line-height: 1.5; }
    .trace-head.failed { color: var(--red); background: transparent; }
    .trace-label { margin-top: 7px; color: var(--muted); font-size: 10px; font-weight: 750; }
    .trace-pre { max-height: 220px; overflow: auto; margin: 3px 0 0; padding: 7px; white-space: pre-wrap; word-break: break-word; border: 1px solid #e3e8e2; border-radius: 4px; background: #f2f5f1; color: #37443d; font-family: "Cascadia Code", Consolas, monospace; font-size: 10px; line-height: 1.5; }
    .virtual-spacer td { padding: 0; border: 0; pointer-events: none; }

    @media (max-width: 900px) {
      header { align-items: flex-start; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .settings-band { grid-template-columns: 1fr; align-items: stretch; }
      .stats { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>MCQ 題庫品質審核</h1>
        <div class="subtitle">本機審核紀錄 · 每題獨立確認後才更新 Supabase</div>
      </div>
      <div class="connection"><span class="dot" id="dot"></span><span id="connectionText">連接中</span></div>
    </header>

    <main>
      <div class="toolbar">
        <div class="actions">
          <button class="primary" id="scanOne" onclick="scanOne()">審核下一題</button>
          <button id="scanAll" onclick="startContinuous()">連續審核</button>
          <button id="pause" onclick="stopContinuous()" disabled>暫停</button>
          <a class="download" href="/api/export-audit">匯出紀錄</a>
          <button class="danger" onclick="clearAuditHistory()">清除本機審核紀錄</button>
        </div>
        <div class="batch-controls">
          <div class="batch-field">
            <label for="batchCount">未審核題數</label>
            <input id="batchCount" type="number" min="1" max="1000" value="5">
          </div>
          <div class="batch-field">
            <label for="parallelWorkers">並行工作者</label>
            <input id="parallelWorkers" type="number" min="1" max="100" value="4">
          </div>
          <button class="primary" id="batchScan" onclick="scanBatch()">批量並行審核</button>
          <span class="batch-progress" id="batchProgress"></span>
        </div>
        <div class="filters" id="filters">
          <button class="filter active" data-status="" onclick="setFilter('', this)">全部題目</button>
          <button class="filter" data-status="unscanned" onclick="setFilter('unscanned', this)">未審核</button>
          <button class="filter" data-status="audited" onclick="setFilter('audited', this)">已審核（通過／已推送）</button>
          <button class="filter" data-status="passed" onclick="setFilter('passed', this)">通過</button>
          <button class="filter" data-status="pending" onclick="setFilter('pending', this)">待確認</button>
          <button class="filter" data-status="pushed" onclick="setFilter('pushed', this)">已推送</button>
          <button class="filter" data-status="failed" onclick="setFilter('failed', this)">失敗</button>
        </div>
      </div>

      <section class="settings-band" aria-label="審核模型設定">
        <div class="setting-field">
          <label for="criticBot">Critic Bot 名稱</label>
          <input id="criticBot" type="text" autocomplete="off" placeholder="例如 Claude-Sonnet-4.5">
        </div>
        <div class="setting-field">
          <label for="correctorBot">Corrector Bot 名稱</label>
          <input id="correctorBot" type="text" autocomplete="off" placeholder="例如 Claude-Sonnet-4.5">
        </div>
        <div class="setting-field">
          <label for="iterationRounds">修正迭代輪數（1–5）</label>
          <input id="iterationRounds" type="number" min="1" max="5" step="1">
        </div>
        <div class="settings-actions">
          <button class="primary" id="saveSettings" onclick="saveSettings()">儲存設定</button>
          <button id="reloadSettings" onclick="loadSettings()" title="重新載入設定">重新載入</button>
          <span class="settings-status" id="settingsStatus"></span>
        </div>
      </section>

      <section class="stats">
        <div class="stat"><div class="stat-label">總題數</div><div class="stat-value" id="total">0</div></div>
        <div class="stat"><div class="stat-label">已審核</div><div class="stat-value" id="scanned">0</div></div>
        <div class="stat"><div class="stat-label">直接通過</div><div class="stat-value" id="passed">0</div></div>
        <div class="stat"><div class="stat-label">待確認修正</div><div class="stat-value" id="pending">0</div></div>
        <div class="stat"><div class="stat-label">已推送</div><div class="stat-value" id="pushed">0</div></div>
        <div class="stat"><div class="stat-label">失敗</div><div class="stat-value" id="failed">0</div></div>
      </section>
      <div class="progress-shell"><div class="progress" id="progress"></div></div>
      <div class="notice" id="notice"></div>

      <div class="selection-bar">
        <span class="selection-count" id="selectionCount">未選取待處理修正</span>
        <button id="selectPage" onclick="selectCurrentPage()">選取目前頁待推送</button>
        <button id="bulkApprove" class="primary" onclick="bulkDecision('approve')" disabled>批量確認並推送</button>
        <button id="bulkReject" class="danger" onclick="bulkDecision('reject')" disabled>批量拒絕</button>
        <button onclick="clearSelection()">清除選擇</button>
        <div class="score-quick-select" id="scoreQuickSelect">
          <strong>待確認快速選取：</strong>
          <select id="minPendingScore" aria-label="最低分數">
            <option value="7">評分 >= 7</option>
            <option value="8">評分 >= 8</option>
            <option value="9">評分 >= 9</option>
            <option value="10">評分 >= 10</option>
          </select>
          <button onclick="selectByScore()">選取全部符合項目</button>
          <span id="scoreSelectionStatus"></span>
        </div>
      </div>

      <div class="table-wrap" id="tableViewport">
        <table>
          <thead>
            <tr>
              <th><input class="select-page" id="selectPageCheckbox" type="checkbox" onchange="toggleCurrentPage(this)" aria-label="選取目前頁待處理修正"></th>
              <th>題目</th>
              <th>原題</th>
              <th>建議修正</th>
              <th>評分</th>
              <th>審核意見</th>
              <th>狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="rows"><tr><td colspan="8" class="empty">載入中</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <form class="modal-panel" onsubmit="saveProposalEdit(event)">
      <div class="modal-header">
        <div>
          <h2 class="modal-title" id="editModalTitle">手動編輯修正提案</h2>
          <div class="meta" id="editModalMeta"></div>
        </div>
        <button class="modal-close" type="button" onclick="closeEditor()" aria-label="關閉">×</button>
      </div>
      <label class="edit-label" for="editStem">題幹</label>
      <textarea class="edit-textarea" id="editStem" required></textarea>
      <div class="edit-label">選項文字</div>
      <div id="editOptions"></div>
      <div class="modal-note">正確答案標記沿用 LLM 提案；你可以同時修改選項文字及解釋。儲存後仍需按「確認並推送」才會更新 Supabase。</div>
      <div class="modal-actions">
        <button type="button" onclick="closeEditor()">取消</button>
        <button class="primary" id="saveProposal" type="submit">儲存手動修改</button>
      </div>
    </form>
  </div>

  <script>
    let currentFilter = '';
    let continuous = false;
    let busy = false;
    let editingAuditId = null;
    let batchJobId = null;
    let batchCursor = 0;
    let batchPollTimer = null;
    let bulkBusy = false;
    const reviewCache = new Map();
    const selectedAuditIds = new Set();
    let selectedCriteria = null;
    let selectedCriteriaCount = 0;
    const INVENTORY_PAGE_SIZE = 40;
    const MAX_RENDERED_ROWS = INVENTORY_PAGE_SIZE * 2;
    const ESTIMATED_ROW_HEIGHT = 150;
    const inventoryState = {
      rows: [],
      start: 0,
      end: 0,
      total: 0,
      topSpacerPx: 0,
      loading: false,
      loadingGeneration: null,
      generation: 0,
    };

    const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    })[char]);

    async function request(url, options) {
      const response = await fetch(url, options);
      const text = await response.text();
      let data = {};
      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        const error = new Error(
          `伺服器回應無效（HTTP ${response.status}）：${text.slice(0, 180) || '沒有內容'}`,
        );
        error.status = response.status;
        error.retryable = response.status >= 500 || response.status === 429;
        throw error;
      }
      if (!response.ok) {
        const error = new Error(data.detail || data.error || `請求失敗（HTTP ${response.status}）`);
        error.status = response.status;
        error.retryable = response.status >= 500 || response.status === 429;
        throw error;
      }
      return data;
    }

    async function refresh() {
      try {
        await refreshSummary();
        await resetInventory();
        document.getElementById('dot').classList.add('ok');
        document.getElementById('connectionText').textContent = '本機服務正常';
      } catch (error) {
        document.getElementById('dot').classList.remove('ok');
        document.getElementById('connectionText').textContent = error.message;
        showNotice(error.message, true);
      }
    }

    async function refreshSummary() {
      const summary = await request('/api/summary');
      renderSummary(summary);
    }

    async function clearAuditHistory() {
      if (busy || batchJobId) {
        showNotice('批次或審核進行中，請完成後再清除本機紀錄。', true);
        return;
      }
      if (!window.confirm('確定清除所有本機審核紀錄？這會移除通過、失敗、待確認、推送狀態、提案及 LLM traces；Supabase 題目不會改動。')) return;
      try {
        const result = await request('/api/audit-history/clear', { method: 'POST' });
        selectedAuditIds.clear();
        await refresh();
        showNotice(`已清除 ${result.deleted_count} 條本機審核紀錄；所有題目可重新審核。`);
      } catch (error) {
        showNotice(error.message, true);
      }
    }

    function renderSummary(data) {
      document.getElementById('total').textContent = data.total_questions;
      for (const key of ['scanned', 'passed', 'pending', 'pushed', 'failed']) {
        document.getElementById(key).textContent = data[key] || 0;
      }
      const percent = data.total_questions ? Math.min(100, data.scanned / data.total_questions * 100) : 0;
      document.getElementById('progress').style.width = `${percent}%`;
    }

    async function resetInventory() {
      const generation = ++inventoryState.generation;
      inventoryState.rows = [];
      inventoryState.start = 0;
      inventoryState.end = 0;
      inventoryState.total = 0;
      inventoryState.topSpacerPx = 0;
      document.getElementById('tableViewport').scrollTop = 0;
      renderVirtualRows();
      await loadInventoryPage(0, 'replace', generation);
    }

    async function refreshVisibleInventory() {
      const generation = inventoryState.generation;
      if (inventoryState.loading && inventoryState.loadingGeneration === generation) return;
      const offset = inventoryState.start;
      const limit = Math.min(
        100,
        Math.max(INVENTORY_PAGE_SIZE, inventoryState.rows.length || INVENTORY_PAGE_SIZE),
      );
      inventoryState.loading = true;
      inventoryState.loadingGeneration = generation;
      try {
        const params = new URLSearchParams({
          offset: String(offset),
          limit: String(limit),
        });
        if (currentFilter) params.set('status', currentFilter);
        const data = await request(`/api/questions/page?${params.toString()}`);
        if (generation !== inventoryState.generation) return;
        inventoryState.rows = data.rows || [];
        inventoryState.start = data.offset;
        inventoryState.end = data.offset + inventoryState.rows.length;
        inventoryState.total = data.total;
        renderVirtualRows();
      } finally {
        if (inventoryState.loadingGeneration === generation) {
          inventoryState.loading = false;
          inventoryState.loadingGeneration = null;
        }
      }
    }

    async function loadInventoryPage(offset, mode, generation = inventoryState.generation) {
      if ((inventoryState.loading && inventoryState.loadingGeneration === generation) || generation !== inventoryState.generation) return;
      if (mode === 'append' && offset >= inventoryState.total) return;
      if (mode === 'prepend' && offset >= inventoryState.start) return;
      inventoryState.loading = true;
      inventoryState.loadingGeneration = generation;
      try {
        const params = new URLSearchParams({
          offset: String(offset),
          limit: String(INVENTORY_PAGE_SIZE),
        });
        if (currentFilter) params.set('status', currentFilter);
        const data = await request(`/api/questions/page?${params.toString()}`);
        if (generation !== inventoryState.generation) return;

        if (mode === 'replace') {
          inventoryState.rows = data.rows || [];
          inventoryState.start = data.offset;
          inventoryState.end = data.offset + inventoryState.rows.length;
          inventoryState.total = data.total;
          inventoryState.topSpacerPx = 0;
        } else if (mode === 'append') {
          if (offset !== inventoryState.end) return;
          inventoryState.rows = inventoryState.rows.concat(data.rows || []);
          inventoryState.end = offset + (data.rows || []).length;
          inventoryState.total = data.total;
        } else if (mode === 'prepend') {
          if (offset + (data.rows || []).length !== inventoryState.start) return;
          inventoryState.rows = (data.rows || []).concat(inventoryState.rows);
          inventoryState.start = offset;
          inventoryState.topSpacerPx = Math.max(
            0,
            inventoryState.topSpacerPx - (data.rows || []).length * ESTIMATED_ROW_HEIGHT,
          );
          inventoryState.total = data.total;
        }
        renderVirtualRows();
        if (mode === 'append') pruneTopRows();
      } finally {
        if (inventoryState.loadingGeneration === generation) {
          inventoryState.loading = false;
          inventoryState.loadingGeneration = null;
        }
      }
    }

    function virtualSpacer(height) {
      if (height <= 0) return '';
      return `<tr class="virtual-spacer"><td colspan="8" style="height:${Math.ceil(height)}px"></td></tr>`;
    }

    function renderVirtualRows() {
      const target = document.getElementById('rows');
      reviewCache.clear();
      if (!inventoryState.rows.length) {
        target.innerHTML = '<tr><td colspan="8" class="empty">此狀態暫無題目</td></tr>';
        updateSelectionUi();
        return;
      }
      const remaining = Math.max(0, inventoryState.total - inventoryState.end);
      target.innerHTML = [
        virtualSpacer(inventoryState.topSpacerPx),
        inventoryState.rows.map(renderQuestionRow).join(''),
        virtualSpacer(remaining * ESTIMATED_ROW_HEIGHT),
      ].join('');
      updateSelectionUi();
    }

    function pruneTopRows() {
      if (inventoryState.rows.length <= MAX_RENDERED_ROWS) return;
      const removeCount = inventoryState.rows.length - INVENTORY_PAGE_SIZE;
      const domRows = [...document.querySelectorAll('#rows tr.data-row')].slice(0, removeCount);
      const removedHeight = domRows.reduce((total, row) => total + row.getBoundingClientRect().height, 0);
      inventoryState.rows = inventoryState.rows.slice(removeCount);
      inventoryState.start += removeCount;
      inventoryState.topSpacerPx += removedHeight || removeCount * ESTIMATED_ROW_HEIGHT;
      renderVirtualRows();
    }

    function renderQuestionRow(review) {
        if (review.audit_id) reviewCache.set(Number(review.audit_id), review);
        const original = review.original || {};
        const proposed = review.proposed || null;
        const score = review.final_score ?? review.original_score ?? 0;
        const auditId = review.audit_id;
        const canDecide = Boolean(auditId) && review.approval_status === 'pending';
        const canEdit = canDecide && proposed && proposed.options && proposed.options.length === 4;
        if (auditId && !canDecide) selectedAuditIds.delete(Number(auditId));
        return `<tr class="data-row" data-question-id="${esc(review.question_id)}">
          <td><input class="row-select" type="checkbox" data-audit-id="${esc(auditId || '')}" ${canDecide ? '' : 'disabled'} ${canDecide && selectionMatchesRow(review) ? 'checked' : ''} onchange="toggleSelected(this)" aria-label="選取 ${esc(review.question_id)}"></td>
          <td>
            <strong>${esc(review.question_id)}</strong>
            <div class="meta">${esc(review.passage_id)} · ${auditId ? `最近審核 ${formatDate(review.scanned_at)}` : '尚未審核'}</div>
            ${renderHistory(review.history || [])}
          </td>
          <td class="stem">
            ${esc(original.stem)}
            ${renderComparison(original.options || [], proposed?.options || [])}
          </td>
          <td class="stem">${proposed ? esc(proposed.question_stem) : '<span class="meta">無需修正</span>'}${review.proposal_edit_count ? `<div class="meta">手動修改 ${esc(review.proposal_edit_count)} 次</div>` : ''}</td>
          <td><span class="score ${score >= 7 ? 'good' : 'low'}">${esc(score)}/10</span><div class="meta">原評 ${esc(review.original_score ?? '—')}</div><div class="meta">修正迭代 ${esc(review.iterations_done ?? 0)} 輪</div></td>
          <td class="comment">${esc(review.critic_comments || review.error_message || '')}<div class="meta">${esc(review.revision_instructions || '')}</div>${renderTraces(review)}</td>
          <td>
            <span class="badge ${esc(review.audit_status)}">${statusLabel(review.audit_status)}</span>
            <div style="margin-top:6px"><span class="badge ${esc(review.approval_status)}">${approvalLabel(review)}</span></div>
          </td>
          <td><div class="row-actions">
            ${canEdit ? `<button onclick="openEditor(${auditId})">手動編輯</button>` : ''}
            ${canDecide ? `<button class="primary" onclick="approve(${auditId})">確認並推送</button><button class="danger" onclick="rejectReview(${auditId})">拒絕</button>` : ''}
            ${auditId && review.audit_status !== 'scanning' ? `<button onclick="reAudit(${auditId})">重新審核</button>` : ''}
            ${!canEdit && !canDecide && review.audit_status === 'scanning' ? '<span class="meta">審核中</span>' : ''}
          </div></td>
        </tr>`;
    }

    function currentEligibleRows() {
      return inventoryState.rows.filter((row) => (
        row.audit_id && row.approval_status === 'pending'
      ));
    }

    function toggleSelected(checkbox) {
      const auditId = Number(checkbox.dataset.auditId);
      if (!auditId) return;
      if (selectedCriteria) {
        showNotice('評分快速選取已套用整個符合項目；如需逐行選取，請先清除選擇。', true);
        renderVirtualRows();
        return;
      }
      if (checkbox.checked) selectedAuditIds.add(auditId);
      else selectedAuditIds.delete(auditId);
      updateSelectionUi();
    }

    function toggleCurrentPage(checkbox) {
      selectedCriteria = null;
      selectedCriteriaCount = 0;
      for (const row of currentEligibleRows()) {
        const auditId = Number(row.audit_id);
        if (checkbox.checked) selectedAuditIds.add(auditId);
        else selectedAuditIds.delete(auditId);
      }
      renderVirtualRows();
    }

    function selectCurrentPage() {
      selectedCriteria = null;
      selectedCriteriaCount = 0;
      for (const row of currentEligibleRows()) {
        selectedAuditIds.add(Number(row.audit_id));
      }
      renderVirtualRows();
    }

    function clearSelection() {
      selectedAuditIds.clear();
      selectedCriteria = null;
      selectedCriteriaCount = 0;
      renderVirtualRows();
    }

    function selectionMatchesRow(row) {
      if (selectedCriteria) {
        const score = Number(row.final_score ?? row.original_score ?? -1);
        return row.approval_status === 'pending' && score >= selectedCriteria.min_score;
      }
      return Boolean(row.audit_id) && selectedAuditIds.has(Number(row.audit_id));
    }

    function updateSelectionUi() {
      const eligible = currentEligibleRows();
      const selectedVisible = eligible.filter(selectionMatchesRow);
      const header = document.getElementById('selectPageCheckbox');
      if (header) {
        header.disabled = eligible.length === 0;
        header.checked = eligible.length > 0 && selectedVisible.length === eligible.length;
        header.indeterminate = selectedVisible.length > 0 && selectedVisible.length < eligible.length;
      }
      const scoreControls = document.getElementById('scoreQuickSelect');
      scoreControls.classList.toggle('visible', currentFilter === 'pending');
      const count = selectedCriteria ? selectedCriteriaCount : selectedAuditIds.size;
      document.getElementById('selectionCount').textContent = count
        ? selectedCriteria
          ? `已選評分 >= ${selectedCriteria.min_score} 的 ${count} 行`
          : `已選 ${count} 行待處理修正`
        : '未選取待處理修正';
      document.getElementById('bulkApprove').disabled = count === 0;
      document.getElementById('bulkReject').disabled = count === 0;
    }

    function renderComparison(original, proposed) {
      if (!original.length) return '';
      return `<details><summary>${proposed.length ? '比較四個選項' : '查看四個選項'}</summary><div class="compare">
        ${renderOptions('原選項', original)}
        ${proposed.length ? renderOptions('建議選項', proposed) : ''}
      </div></details>`;
    }

    function renderHistory(history) {
      if (!history.length) return '';
      return `<details class="trace-details"><summary>審核歷史（${history.length} 次，題目只顯示一行）</summary><div class="trace-list">${history.map((item) => `
        <div class="trace-card">
          <div class="trace-head">第 ${esc(item.audit_round)} 次 · ${esc(statusLabel(item.audit_status))} · ${esc(approvalLabel(item))} · ${formatDate(item.scanned_at)}</div>
          <div class="meta">評分 ${esc(item.final_score ?? item.original_score ?? '—')} · 修正迭代 ${esc(item.iterations_done ?? 0)} 輪${item.error_message ? ` · ${esc(item.error_message)}` : ''}</div>
        </div>
      `).join('')}</div></details>`;
    }

    function renderOptions(title, options) {
      return `<div class="option-list"><strong>${title}</strong>${options.map((option, index) => `
        <div class="option ${option.is_correct ? 'correct' : ''}">
          <div>${String.fromCharCode(65 + index)}. ${esc(option.text)}${option.is_correct ? '（正確）' : ''}</div>
          <div class="option-explanation">解釋：${esc(option.explanation || '—')}</div>
        </div>
      `).join('')}</div>`;
    }

    function renderTraces(review) {
      const traces = review.traces || [];
      if (!traces.length) return '';
      return `<details class="trace-details"><summary>查看 LLM runs（${traces.length}）</summary><div class="trace-list">${traces.map((trace, index) => {
        const agent = trace.workflow_agent || trace.agent || 'LLM';
        const iteration = trace.workflow_iteration ?? '—';
        const attempt = trace.json_attempt ?? 1;
        const parseLabel = trace.parse_ok === false ? 'JSON 失敗' : 'JSON 成功';
        const parseClass = trace.parse_ok === false ? 'failed' : '';
        return `<div class="trace-card">
          <div class="trace-head ${parseClass}">${index + 1}. ${esc(agent)} · ${esc(trace.phase || '')} · 第 ${esc(iteration)} 輪 · JSON attempt ${esc(attempt)} · ${esc(parseLabel)} · ${esc(trace.bot || '')}</div>
          <div class="trace-label">輸入 Prompt</div>
          <pre class="trace-pre">${esc(trace.merged_prompt || '')}</pre>
          <div class="trace-label">輸出 Response</div>
          <pre class="trace-pre">${esc(trace.raw_response || '')}</pre>
          ${trace.parse_error ? `<div class="trace-label">解析錯誤</div><pre class="trace-pre">${esc(trace.parse_error)}</pre>` : ''}
        </div>`;
      }).join('')}</div></details>`;
    }

    function statusLabel(status) {
      return ({ passed: '已審核／通過', pushed: '已審核／已推送', pending: '待確認', correction_proposed: '建議修正', failed: '未審核／上次失敗', unscanned: '未審核', rejected: '已拒絕／未完成', scanning: '審核中' })[status] || status;
    }

    function approvalLabel(review) {
      if (review.push_status === 'pushed') return '已推送';
      return ({ pending: '待確認', rejected: '已拒絕', approved: '已批准', not_required: '無需批准' })[review.approval_status] || review.approval_status;
    }

    function formatDate(value) {
      if (!value) return '';
      return new Date(value).toLocaleString('zh-HK', { hour12: false });
    }

    async function scanBatch() {
      if (busy) return;
      const count = Number.parseInt(document.getElementById('batchCount').value, 10);
      const parallelWorkers = Number.parseInt(document.getElementById('parallelWorkers').value, 10);
      if (!Number.isInteger(count) || count < 1 || count > 1000) {
        showNotice('未審核題數必須介乎 1 至 1000。', true);
        return;
      }
      if (!Number.isInteger(parallelWorkers) || parallelWorkers < 1 || parallelWorkers > 100) {
        showNotice('並行工作者數目必須介乎 1 至 100。', true);
        return;
      }

      busy = true;
      setScanButtons(true);
      try {
        const job = await request('/api/scan-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ count, parallel_workers: parallelWorkers }),
        });
        batchJobId = job.job_id;
        batchCursor = 0;
        setBatchProgress(`批次已開始：0 / ${count} 完成`);
        showNotice(`已開始 ${count} 題並行審核；每題完成後會立即出現在表格。`);
        void pollBatchJob();
      } catch (error) {
        busy = false;
        setScanButtons(false);
        showNotice(error.message, true);
      }
    }

    async function pollBatchJob() {
      if (!batchJobId) return;
      try {
        const data = await request(
          `/api/scan-batch/${batchJobId}?since=${batchCursor}`,
        );
        batchCursor = data.next_cursor;
        if (data.results.length) {
          try {
            await refreshSummary();
            await refreshVisibleInventory();
          } catch (refreshError) {
            showNotice(`題目表格暫時未能更新，批次仍會繼續：${refreshError.message}`, true);
          }
          const latest = data.results[data.results.length - 1];
          const skippedText = data.skipped_claim_count
            ? `；略過 ${data.skipped_claim_count} 個讀取失敗候選`
            : '';
          setBatchProgress(
            `批次進度：完成 ${data.completed_count} / ${data.requested_count}；`
            + `已送入 ${data.claimed_count} / ${data.requested_count}${skippedText}`,
          );
          showNotice(`題目 ${latest.question_id} 已完成：${statusLabel(latest.status)}；可立即編輯或推送。`);
        }

        if (data.status === 'running') {
          batchPollTimer = window.setTimeout(() => void pollBatchJob(), 500);
          return;
        }

        const completed = data.completed_count;
        const failed = data.failed_count;
        batchJobId = null;
        batchPollTimer = null;
        busy = false;
        setScanButtons(false);
        const skipped = data.skipped_claim_count || 0;
        setBatchProgress(`批次完成：${completed} / ${data.requested_count} 題，LLM 失敗 ${failed} 題，讀取略過 ${skipped} 題`);
        try {
          await refreshSummary();
          await refreshVisibleInventory();
        } catch (refreshError) {
          showNotice(`批次已完成，但表格重新載入失敗：${refreshError.message}`, true);
        }
        const jobError = data.error ? `；批次錯誤：${data.error}` : '';
        showNotice(`批量完成：${completed} / ${data.requested_count} 題，LLM 失敗 ${failed} 題，讀取略過 ${skipped} 題${jobError}。已完成的題目可逐一編輯或推送。`);
      } catch (error) {
        if (error.status === 404) {
          batchJobId = null;
          batchPollTimer = null;
          busy = false;
          setScanButtons(false);
          showNotice(`批次工作不存在，已停止輪詢：${error.message}`, true);
          return;
        }

        // A transient poll failure must not discard the job ID. Retry so
        // already-running workers and their independent results remain visible.
        setBatchProgress(`批次輪詢暫時失敗，正在重試：${error.message}`);
        showNotice(`批次仍在背景執行，暫時未能取得進度：${error.message}`, true);
        batchPollTimer = window.setTimeout(() => void pollBatchJob(), 1500);
      }
    }

    function setBatchProgress(message) {
      document.getElementById('batchProgress').textContent = message;
    }

    async function scanOne(fromLoop = false) {
      if (busy) return;
      busy = true;
      setScanButtons(true);
      showNotice('正在審核一條題目，請保持此頁開啟。');
      try {
        const result = await request('/api/scan-next', { method: 'POST' });
        await refresh();
        if (result.status === 'complete') {
          continuous = false;
          showNotice('所有題目均已有本機審核紀錄。');
        } else {
          showNotice(`完成 ${result.question_id}：${statusLabel(result.status)}`);
        }
      } catch (error) {
        continuous = false;
        showNotice(error.message, true);
      } finally {
        busy = false;
        setScanButtons(false);
      }
      if (fromLoop && continuous) window.setTimeout(() => scanOne(true), 400);
    }

    function startContinuous() {
      continuous = true;
      document.getElementById('pause').disabled = false;
      scanOne(true);
    }

    function stopContinuous() {
      continuous = false;
      document.getElementById('pause').disabled = true;
      if (!busy) setScanButtons(false);
      showNotice('連續審核會在目前題目完成後暫停。');
    }

    function setScanButtons(isBusy) {
      document.getElementById('scanOne').disabled = isBusy || continuous;
      document.getElementById('scanAll').disabled = isBusy || continuous;
      document.getElementById('batchScan').disabled = isBusy || continuous;
      document.getElementById('batchCount').disabled = isBusy || continuous;
      document.getElementById('parallelWorkers').disabled = isBusy || continuous;
      document.getElementById('pause').disabled = !continuous;
      setSettingsDisabled(isBusy || continuous);
    }

    function setSettingsDisabled(disabled) {
      for (const id of ['criticBot', 'correctorBot', 'iterationRounds', 'saveSettings', 'reloadSettings']) {
        document.getElementById(id).disabled = disabled;
      }
    }

    async function loadSettings() {
      const status = document.getElementById('settingsStatus');
      status.textContent = '載入中';
      try {
        const settings = await request('/api/settings');
        document.getElementById('criticBot').value = settings.critic_bot || '';
        document.getElementById('correctorBot').value = settings.corrector_bot || '';
        document.getElementById('iterationRounds').value = settings.max_revise_iterations || 1;
        status.textContent = '已載入本機設定';
      } catch (error) {
        status.textContent = '載入失敗';
        showNotice(error.message, true);
      }
    }

    async function saveSettings() {
      const criticBot = document.getElementById('criticBot').value.trim();
      const correctorBot = document.getElementById('correctorBot').value.trim();
      const rounds = Number.parseInt(document.getElementById('iterationRounds').value, 10);
      if (!criticBot || !correctorBot) {
        showNotice('Critic 和 Corrector Bot 名稱不可留空。', true);
        return;
      }
      if (!Number.isInteger(rounds) || rounds < 1 || rounds > 5) {
        showNotice('修正迭代輪數必須介乎 1 至 5。', true);
        return;
      }

      setSettingsDisabled(true);
      const status = document.getElementById('settingsStatus');
      status.textContent = '儲存中';
      try {
        const result = await request('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            critic_bot: criticBot,
            corrector_bot: correctorBot,
            max_revise_iterations: rounds,
          }),
        });
        status.textContent = '已儲存';
        document.getElementById('criticBot').value = result.settings.critic_bot;
        document.getElementById('correctorBot').value = result.settings.corrector_bot;
        document.getElementById('iterationRounds').value = result.settings.max_revise_iterations;
        showNotice('審核模型設定已儲存在本機，下一題開始生效。');
      } catch (error) {
        status.textContent = '儲存失敗';
        showNotice(error.message, true);
      } finally {
        setSettingsDisabled(false);
      }
    }

    function openEditor(auditId) {
      const review = reviewCache.get(Number(auditId));
      if (!review || review.approval_status !== 'pending' || !review.proposed) return;
      const proposal = review.proposed;
      const originalOptions = (review.original && review.original.options) || [];
      editingAuditId = Number(auditId);
      document.getElementById('editModalMeta').textContent = `${review.question_id} · 第 ${review.audit_round || 1} 次審核`;
      document.getElementById('editStem').value = proposal.question_stem || '';
      document.getElementById('editOptions').innerHTML = (proposal.options || []).map((option, index) => `
        <div class="edit-option-row">
          <div class="edit-option-label">${String.fromCharCode(65 + index)}</div>
          <div>
            <textarea class="edit-textarea" data-option-index="${index}" data-option-kind="text" required>${esc(option.text || '')}</textarea>
            <div class="edit-original">原本選項解釋：${esc(originalOptions[index]?.explanation || '—')}</div>
            <label class="edit-label" for="editExplanation${index}">修改後解釋</label>
            <textarea class="edit-textarea" id="editExplanation${index}" data-option-index="${index}" data-option-kind="explanation" required>${esc(option.explanation || '')}</textarea>
            ${option.is_correct ? '<div class="edit-correct">正確答案</div>' : ''}
          </div>
        </div>
      `).join('');
      document.getElementById('editModal').classList.add('open');
      document.getElementById('editStem').focus();
    }

    function closeEditor() {
      editingAuditId = null;
      document.getElementById('editModal').classList.remove('open');
    }

    async function saveProposalEdit(event) {
      event.preventDefault();
      if (!editingAuditId) return;
      const stem = document.getElementById('editStem').value.trim();
      const optionTexts = [...document.querySelectorAll('#editOptions textarea[data-option-kind="text"]')].map((field) => field.value.trim());
      const optionExplanations = [...document.querySelectorAll('#editOptions textarea[data-option-kind="explanation"]')].map((field) => field.value.trim());
      if (!stem || optionTexts.length !== 4 || optionExplanations.length !== 4 || optionTexts.some((text) => !text) || optionExplanations.some((text) => !text)) {
        showNotice('題幹、四個選項及四個選項解釋均不可留空。', true);
        return;
      }
      const button = document.getElementById('saveProposal');
      button.disabled = true;
      try {
        await request(`/api/reviews/${editingAuditId}/proposal`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question_stem: stem, option_texts: optionTexts, option_explanations: optionExplanations }),
        });
        closeEditor();
        showNotice('手動修改已儲存，請再確認是否推送。');
        await refresh();
      } catch (error) {
        showNotice(error.message, true);
      } finally {
        button.disabled = false;
      }
    }

    async function reAudit(auditId) {
      if (busy) return;
      const review = reviewCache.get(Number(auditId));
      if (!review) return;
      if (!window.confirm(`重新審核 ${review.question_id}？系統會讀取目前 Supabase 題目，並建立新的本機審核紀錄；舊紀錄會保留。`)) return;
      busy = true;
      setScanButtons(true);
      showNotice(`正在重新審核 ${review.question_id}。`);
      try {
        const result = await request(`/api/reviews/${auditId}/re-audit`, { method: 'POST' });
        showNotice(`重新審核完成：${statusLabel(result.status)}。`);
        await refresh();
      } catch (error) {
        showNotice(error.message, true);
      } finally {
        busy = false;
        setScanButtons(false);
      }
    }

    async function approve(id) {
      if (!window.confirm('確認將這項修正寫入 Supabase？此操作只更新題幹、評分及選項。')) return;
      try {
        await request(`/api/reviews/${id}/approve`, { method: 'POST' });
        showNotice('修正已寫入 Supabase。');
        await refresh();
      } catch (error) {
        showNotice(error.message, true);
      }
    }

    async function bulkDecision(decision) {
      const selectedCount = selectedCriteria ? selectedCriteriaCount : selectedAuditIds.size;
      if (bulkBusy || selectedCount === 0) return;
      const actionLabel = decision === 'approve' ? '確認並推送' : '拒絕';
      if (!window.confirm(`確定對 ${selectedCount} 行執行「${actionLabel}」？`)) return;

      bulkBusy = true;
      document.getElementById('bulkApprove').disabled = true;
      document.getElementById('bulkReject').disabled = true;
      showNotice(`正在對 ${selectedCount} 行執行「${actionLabel}」...`);
      try {
        const body = selectedCriteria
          ? { criteria: selectedCriteria, decision }
          : { audit_ids: [...selectedAuditIds], decision };
        const result = await request('/api/reviews/bulk-decision', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        selectedAuditIds.clear();
        selectedCriteria = null;
        selectedCriteriaCount = 0;
        await refreshSummary();
        await refreshVisibleInventory();
        const failureText = result.failed_count ? `，失敗 ${result.failed_count} 行（保留待處理狀態）` : '';
        showNotice(`批量${actionLabel}完成：成功 ${result.succeeded_count} 行${failureText}。`);
      } catch (error) {
        showNotice(error.message, true);
      } finally {
        bulkBusy = false;
        updateSelectionUi();
      }
    }

    async function rejectReview(id) {
      if (!window.confirm('拒絕這項修正？原題不會改動。')) return;
      try {
        await request(`/api/reviews/${id}/reject`, { method: 'POST' });
        showNotice('修正已拒絕，Supabase 未有改動。');
        await refresh();
      } catch (error) {
        showNotice(error.message, true);
      }
    }

    function setFilter(status, button) {
      if (status !== 'pending') {
        selectedAuditIds.clear();
        selectedCriteria = null;
        selectedCriteriaCount = 0;
      }
      currentFilter = status;
      document.querySelectorAll('.filter').forEach((item) => item.classList.remove('active'));
      button.classList.add('active');
      refresh();
    }

    async function selectByScore() {
      if (busy) return;
      const minScore = Number.parseInt(document.getElementById('minPendingScore').value, 10);
      try {
        const result = await request(`/api/reviews/selectable?min_score=${minScore}`);
        selectedAuditIds.clear();
        selectedCriteria = { status: 'pending', min_score: minScore };
        selectedCriteriaCount = result.count;
        currentFilter = 'pending';
        document.querySelectorAll('.filter').forEach((item) => item.classList.remove('active'));
        document.querySelector('.filter[data-status="pending"]').classList.add('active');
        await refresh();
        document.getElementById('scoreSelectionStatus').textContent = `${result.count} 行符合`;
        showNotice(`已選取所有評分 >= ${minScore} 的待確認修正，共 ${result.count} 行。`);
      } catch (error) {
        showNotice(error.message, true);
      }
    }

    async function handleTableScroll() {
      const viewport = document.getElementById('tableViewport');
      if (inventoryState.loading) return;
      const nearBottom = viewport.scrollTop + viewport.clientHeight >= viewport.scrollHeight - 700;
      if (nearBottom && inventoryState.end < inventoryState.total) {
        await loadInventoryPage(inventoryState.end, 'append');
        return;
      }
      if (viewport.scrollTop <= 350 && inventoryState.start > 0) {
        const anchorId = inventoryState.rows[0]?.question_id;
        const anchor = anchorId
          ? document.querySelector(`tr[data-question-id="${CSS.escape(anchorId)}"]`)
          : null;
        const beforeTop = anchor?.getBoundingClientRect().top ?? 0;
        const previousOffset = Math.max(0, inventoryState.start - INVENTORY_PAGE_SIZE);
        await loadInventoryPage(previousOffset, 'prepend');
        const newAnchor = anchorId
          ? document.querySelector(`tr[data-question-id="${CSS.escape(anchorId)}"]`)
          : null;
        if (newAnchor) {
          viewport.scrollTop += newAnchor.getBoundingClientRect().top - beforeTop;
        }
      }
    }

    function showNotice(message, error = false) {
      const notice = document.getElementById('notice');
      notice.textContent = message;
      notice.className = `notice${error ? ' error' : ''}`;
      notice.style.display = 'block';
    }

    refresh();
    loadSettings();
    document.getElementById('tableViewport').addEventListener('scroll', handleTableScroll, { passive: true });

    document.getElementById('editModal').addEventListener('click', (event) => {
      if (event.target.id === 'editModal') closeEditor();
    });
  </script>
</body>
</html>

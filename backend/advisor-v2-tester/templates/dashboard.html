<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Advisor V2 實驗室</title>
  <style>
    :root{--ink:#12231f;--paper:#f4f0e7;--panel:#fffdf7;--line:#d7d0c2;--muted:#69736d;--teal:#007c6c;--orange:#d96824;--red:#b43a36;--blue:#255fa8}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:14px Georgia,"Noto Serif TC",serif} button,input,textarea{font:inherit}
    header{height:62px;padding:0 22px;background:var(--ink);color:#fffaf0;display:flex;align-items:center;gap:15px}.brand{font-size:19px;font-weight:700}.tag{font:12px ui-monospace,monospace;color:#b7dbd2;border:1px solid #45675f;padding:3px 7px;border-radius:3px}.spacer{flex:1}
    button{cursor:pointer;border:1px solid var(--line);border-radius:4px;padding:8px 12px;background:var(--panel);color:var(--ink);font-weight:700}button:hover{border-color:var(--teal);color:var(--teal)}button.primary{background:var(--teal);border-color:var(--teal);color:white}button.primary:hover{background:#00695c;color:white}button:disabled{opacity:.55;cursor:wait}
    .layout{height:calc(100vh - 62px);display:grid;grid-template-columns:minmax(330px,1fr) minmax(380px,1.1fr) minmax(400px,1.25fr);overflow:hidden}.column{min-width:0;overflow:auto;border-right:1px solid var(--line);padding:18px}.column:last-child{border:0}
    h2{margin:0 0 12px;font-size:15px;letter-spacing:.02em}h3{font-size:13px;margin:0}.section{border:1px solid var(--line);background:var(--panel);margin-bottom:14px;border-radius:5px;overflow:hidden}.section-head{padding:10px 12px;background:#eee8db;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}.section-body{padding:12px}.hint{font:12px/1.45 system-ui,sans-serif;color:var(--muted)}
    .roles{display:flex;flex-wrap:wrap;gap:6px}.role{font:12px system-ui,sans-serif;padding:6px 8px}.role.active{background:var(--orange);color:#fff;border-color:var(--orange)}textarea{width:100%;min-height:430px;padding:12px;border:1px solid var(--line);resize:vertical;background:#fffdf8;color:var(--ink);font:12px/1.6 ui-monospace,"Cascadia Code",monospace}textarea:focus{outline:2px solid #b7ddd6;border-color:var(--teal)}
    label{display:block;margin:0 0 6px;font-weight:700}.input{width:100%;padding:9px;border:1px solid var(--line);background:#fffdf8;border-radius:4px}.checks{display:grid;gap:7px;margin:12px 0}.checks label{font:13px system-ui,sans-serif;font-weight:500}.checks input{accent-color:var(--teal);margin-right:7px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mode{font:12px ui-monospace,monospace;padding:4px 7px;border:1px solid var(--line);border-radius:3px}.mode.fixture{background:#e2f1e9;color:#176044}.mode.poe{background:#fae9de;color:#9a4218}.status{font:12px system-ui,sans-serif;color:var(--muted)}
    details{margin-top:11px}summary{cursor:pointer;font:12px system-ui,sans-serif;color:var(--teal);font-weight:700}pre{margin:8px 0 0;white-space:pre-wrap;word-break:break-word;max-height:280px;overflow:auto;padding:10px;background:#f2eee5;border:1px solid var(--line);font:11px/1.5 ui-monospace,"Cascadia Code",monospace}
    .timeline{display:flex;flex-direction:column;gap:10px}.trace{border:1px solid var(--line);border-left:5px solid var(--blue);background:var(--panel);border-radius:4px}.trace.valid{border-left-color:var(--teal)}.trace.invalid,.trace.error{border-left-color:var(--red)}.trace-head{padding:10px 12px;display:flex;align-items:center;gap:9px}.trace-title{font-weight:700}.trace-meta{margin-left:auto;font:11px ui-monospace,monospace;color:var(--muted)}.badge{font:11px ui-monospace,monospace;padding:3px 5px;border-radius:3px;background:#e7e3db}.badge.valid{background:#dcefe5;color:#176044}.badge.error,.badge.invalid{background:#f8dfdc;color:#992c29}.trace-body{padding:0 12px 12px}.empty{padding:30px 12px;text-align:center;color:var(--muted);font:13px system-ui,sans-serif}.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:4px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;font:13px system-ui,sans-serif}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:1050px){.layout{grid-template-columns:1fr 1fr;height:auto;overflow:visible}.column:last-child{grid-column:1/-1;min-height:500px}}@media(max-width:650px){header{padding:0 12px}.layout{display:block}.column{border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:16px}}
  </style>
</head>
<body>
<header><span class="brand">Advisor V2 實驗室</span><span class="tag">LOCAL ONLY</span><span class="spacer"></span><span class="status" id="saveStatus">載入中</span><button id="saveButton" onclick="savePrompt()">儲存提示詞</button></header>
<main class="layout">
  <section class="column">
    <h2>提示詞來源</h2>
    <div class="section"><div class="section-head"><h3 id="promptTitle">載入中</h3><span class="spacer"></span><span class="hint" id="promptHash"></span></div><div class="section-body"><div class="roles" id="roles"></div><p class="hint" id="promptFile"></p><textarea id="promptEditor" spellcheck="false"></textarea></div></div>
    <p class="hint">儲存會直接更新根目錄的 <code>advisor_agentic/*.md</code>，下一次測試立即使用新內容。</p>
  </section>
  <section class="column">
    <h2>工作流程測試</h2>
    <div class="section"><div class="section-head"><h3>學生訊息與資料來源</h3></div><div class="section-body">
      <label for="studentMessage">學生訊息</label><textarea id="studentMessage" style="min-height:120px">我最近閱讀理解總是失分，應該如何改善？</textarea>
      <label for="studentId">學生 ID（預設可更改）</label><input id="studentId" class="input" placeholder="05c32959-d1b2-4787-832a-b6216e5bc7e6">
      <div class="checks"><label><input type="checkbox" value="profile" checked>學生檔案</label><label><input type="checkbox" value="performance" checked>作答表現</label><label><input type="checkbox" value="question_bank" checked>題庫資料</label></div>
      <label for="dataMode">資料來源模式</label><select class="input" id="dataMode"><option value="supabase">Supabase Live Context: 使用與 V2 worker 相同的檢索邏輯</option><option value="fixture">Fixture: 手動覆蓋測試資料</option></select>
      <label for="runMode">執行模式</label><select class="input" id="runMode"><option value="fixture">Fixture: 不呼叫 Poe，以固定 JSON 驗證資料流</option><option value="poe">Live Poe: 以 .env 的角色 bot 真實執行</option></select>
      <div class="row" style="margin-top:12px"><button class="primary" id="runButton" onclick="runWorkflow()">執行完整流程</button><span class="status" id="runStatus"></span></div>
      <p class="hint" id="poeStatus" style="margin:10px 0 0"></p>
      <pre id="poeModels" style="display:none"></pre>
      <details><summary>檢視或覆蓋注入資料（JSON）</summary><textarea id="evidenceEditor" style="min-height:200px"></textarea></details>
    </div></div>
    <div class="section"><div class="section-head"><h3>流程</h3></div><div class="section-body"><p class="hint">Orchestrator 選擇啟用的 specialist；其輸出會整合至 Synthesizer。每張 trace 都保留實際發送與接收的 JSON。</p></div></div>
  </section>
  <section class="column"><h2>訊息追蹤</h2><div id="timeline" class="timeline"><div class="empty">執行測試後，所有 agent 訊息會顯示在這裡。</div></div></section>
</main>
<div class="toast" id="toast"></div>
<script>
let prompts={}, activeRole='orchestrator', fixtureEvidence={}, poeConfiguration={configured:false,missing:[]}, supabaseContextConfiguration={configured:false,missing:[]};
const $=id=>document.getElementById(id);
function toast(message){const node=$('toast');node.textContent=message;node.classList.add('show');setTimeout(()=>node.classList.remove('show'),2600)}
async function boot(){try{const response=await fetch('/api/data');const data=await response.json();prompts=data.prompts;fixtureEvidence=data.fixture_evidence;poeConfiguration=data.poe_configuration;supabaseContextConfiguration=data.supabase_context_configuration||{configured:false,missing:[]};$('studentId').value=data.default_student_id||'';$('evidenceEditor').value=JSON.stringify(fixtureEvidence,null,2);renderRoles();showRole(activeRole);renderPoeStatus();$('saveStatus').textContent='提示詞已載入'}catch(error){$('saveStatus').textContent='載入失敗';toast(error.message)}}
function renderPoeStatus(){const node=$('poeStatus');const models=$('poeModels');const configHints=[];if(!poeConfiguration.configured) configHints.push('Poe: '+poeConfiguration.missing.join('、'));if(!supabaseContextConfiguration.configured) configHints.push('Supabase Context: '+supabaseContextConfiguration.missing.join('、'));node.textContent=configHints.length===0?'Live Poe 與 Supabase context 已設定。按「執行完整流程」可看到實際資料檢索與 agent request / response。':'尚未完成設定：'+configHints.join(' | ');node.style.color=configHints.length===0?'#176044':'#992c29';if(poeConfiguration.active_models){models.style.display='block';models.textContent=JSON.stringify(poeConfiguration.active_models,null,2);}else{models.style.display='none';models.textContent='';}}
function renderRoles(){$('roles').innerHTML=Object.entries(prompts).map(([role,prompt])=>`<button class="role ${role===activeRole?'active':''}" onclick="showRole('${role}')">${prompt.label}</button>`).join('')}
function showRole(role){activeRole=role;const prompt=prompts[role];$('promptTitle').textContent=prompt.label;$('promptFile').textContent='advisor_agentic/'+prompt.filename;$('promptHash').textContent='sha256:'+prompt.hash;$('promptEditor').value=prompt.content;renderRoles()}
async function savePrompt(){const content=$('promptEditor').value;const response=await fetch('/api/prompts/'+activeRole,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});const data=await response.json();if(!response.ok){toast(data.error||'儲存失敗');return}prompts[activeRole].content=content.endsWith('\n')?content:content+'\n';prompts[activeRole].hash=data.hash;$('promptHash').textContent='sha256:'+data.hash;$('saveStatus').textContent='已儲存 '+new Date().toLocaleTimeString();toast('已更新來源 Markdown')}
function enabledSources(){return [...document.querySelectorAll('.checks input:checked')].map(item=>item.value)}
async function runWorkflow(){let overrides={};const dataMode=$('dataMode').value;if(dataMode==='fixture'){try{overrides=JSON.parse($('evidenceEditor').value)}catch(error){toast('注入資料不是有效 JSON');return}}const button=$('runButton');button.disabled=true;$('runStatus').textContent='執行中...';$('timeline').innerHTML='<div class="empty">工作流程執行中...</div>';try{const response=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_message:$('studentMessage').value,student_id:$('studentId').value,data_mode:dataMode,enabled_sources:enabledSources(),mode:$('runMode').value,evidence_overrides:overrides})});const data=await response.json();if(!response.ok)throw new Error(data.error||'執行失敗');renderRun(data.run);$('runStatus').textContent='已完成 '+data.run.request_id.slice(0,8)}catch(error){$('timeline').innerHTML='<div class="empty">'+escapeHtml(error.message)+'</div>';$('runStatus').textContent='失敗'}finally{button.disabled=false}}
function renderRun(run){$('timeline').innerHTML=run.traces.map(trace=>{const summary=summarizeTrace(trace);const title=traceTitle(trace);return `<article class="trace ${trace.status}"><div class="trace-head"><span class="trace-title">${escapeHtml(title)}</span><span class="badge ${trace.status}">${escapeHtml(trace.status)}</span><span class="trace-meta">${trace.duration_ms} ms</span></div><div class="trace-body">${summary?`<pre>${escapeHtml(summary)}</pre>`:''}${trace.validation_errors.length?`<pre>${escapeHtml(trace.validation_errors.join('\n'))}</pre>`:''}<details open><summary>傳送至 Poe / Agent</summary><pre>${escapeHtml(JSON.stringify(trace.request,null,2))}</pre></details><details><summary>原始回覆</summary><pre>${escapeHtml(trace.raw_response||'(none)')}</pre></details><details open><summary>解析後 JSON</summary><pre>${escapeHtml(JSON.stringify(trace.parsed_response,null,2))}</pre></details></div></article>`}).join('')}
function traceTitle(trace){const base=trace.label||trace.role||'trace';const iteration=((trace.request||{}).inputs||{}).iteration;const iterativeRoles=['performance','performance_detail_lookup','question_bank','question_bank_detail_lookup'];return iterativeRoles.includes(trace.role)&&Number.isInteger(iteration)?`${base}（第 ${iteration} 輪）`:base;}
function summarizeTrace(trace){try{if(trace.role==='question_bank'){const input=((trace.request||{}).inputs||{});const mode=input.retrieval_mode||{};const filter=mode.section_filter||'mixed';const passages=Array.isArray(mode.matched_designated_passages)?mode.matched_designated_passages:[];return `retrieval_mode.section_filter = ${filter}\nmatched_designated_passages = ${passages.join('、')||'(none)'}`;}if(trace.role==='orchestrator'){const parsed=trace.parsed_response||{};const passages=Array.isArray(parsed.mentioned_designated_passages)?parsed.mentioned_designated_passages:[];const focus=Array.isArray(parsed.question_bank_focus)?parsed.question_bank_focus:[];if(passages.length||focus.length){return `mentioned_designated_passages = ${passages.join('、')||'(none)'}\nquestion_bank_focus = ${focus.join('、')||'(none)'}`;}}if(trace.role==='performance_detail_lookup'){const input=((trace.request||{}).inputs||{});const output=((trace.parsed_response||{}).output||{});const questionDiagnostics=Array.isArray(output.question_diagnostics)?output.question_diagnostics:[];return `action = ${input.detail_request?.action||'question_diagnostics'}\npassage_names = ${(input.detail_request?.passage_names||[]).join('、')||'(none)'}\nquestion_diagnostics = ${questionDiagnostics.length}`;}if(trace.role==='question_bank_detail_lookup'){const input=((trace.request||{}).inputs||{});const output=((trace.parsed_response||{}).output||{});return `action = ${input.detail_request?.action||'similar_questions'}\npassage_names = ${(input.detail_request?.passage_names||[]).join('、')||'(none)'}\nsimilar_questions = ${(output.similar_questions||[]).length}\nmarking_skill_notes = ${(output.marking_skill_notes||[]).length}`;}return '';}catch(_){return '';}}
function escapeHtml(value){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}boot();
</script>
</body>
</html>
